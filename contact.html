<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buns & Bites | Contact</title>
    <style>
        :root { --bg: #120A06; --card: #1C120C; --maroon: #7A1C2E; --text: #F7EBE1; --muted: #A89284; --gold: #D4AF37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background: var(--bg); color: var(--text); text-align: center; }
        nav { background: rgba(18, 10, 6, 0.85); backdrop-filter: blur(10px); padding: 1.2rem; border-bottom: 1px solid rgba(212, 175, 55, 0.2); position: sticky; top: 0; font-family: sans-serif; }
        nav a { color: var(--muted); text-decoration: none; padding: 8px 16px; letter-spacing: 2px; text-transform: uppercase; font-size: 0.8rem; transition: 0.3s; }
        nav a.active, nav a:hover { color: var(--gold); background: rgba(122, 28, 46, 0.3); }
        section { max-width: 480px; margin: 4rem auto; padding: 1rem; }
        .card { background: var(--card); border: 1px solid rgba(212, 175, 55, 0.2); padding: 2.5rem; margin-top: 1.5rem; }
        input, textarea, button { width: 100%; padding: 14px; margin: 10px 0; border: none; outline: none; font-family: sans-serif; }
        input, textarea { background: rgba(18, 10, 6, 0.6); color: var(--text); border: 1px solid rgba(212, 175, 55, 0.2); font-size: 0.85rem; }
        input:focus, textarea:focus { border-color: var(--gold); }
        button { background: var(--gold); color: var(--bg); font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-weight: bold; }
        button:hover { background: #E5C158; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Intro</a>
        <a href="product.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
    <section>
        <h2 style="font-size: 2.2rem; letter-spacing: 2px; font-weight: normal;">RESERVATIONS</h2>
        <div class="card">
            <p style="color: var(--gold); font-size: 0.9rem; font-family: sans-serif; letter-spacing: 1px;">LOCATION & HOURS</p>
            <p style="color: var(--muted); font-size: 0.85rem; margin-top: 8px; font-family: sans-serif;">88 Burger Lane, New York | Tel: +1 555-888-BUYS</p>
            <p style="color: var(--muted); font-size: 0.85rem; margin-top: 4px; font-family: sans-serif;">Open Daily: 11:00 AM – 09:00 PM</p>
            <form style="margin-top: 2rem;" onsubmit="sendMessage(event)">
                <input type="text" placeholder="FULL NAME" required>
                <input type="email" placeholder="EMAIL ADDRESS" required>
                <textarea placeholder="SPECIAL REQUESTS OR INQUIRIES" rows="3" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>
    <script>
        function sendMessage(e) {
            e.preventDefault();
            alert('Thank you. Your message has been received.');
            e.target.reset();
        }
    </script>
</body>
</html>
