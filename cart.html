<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buns & Bites | Order Cart</title>
    <style>
        :root { --bg: #120A06; --card: #1C120C; --maroon: #7A1C2E; --text: #F7EBE1; --muted: #A89284; --gold: #D4AF37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background: var(--bg); color: var(--text); text-align: center; padding-bottom: 4rem; }
        nav { background: rgba(18, 10, 6, 0.85); backdrop-filter: blur(10px); padding: 1.2rem; border-bottom: 1px solid rgba(212, 175, 55, 0.2); position: sticky; top: 0; font-family: sans-serif; }
        nav a { color: var(--muted); text-decoration: none; padding: 8px 16px; letter-spacing: 2px; text-transform: uppercase; font-size: 0.8rem; transition: 0.3s; }
        nav a.active, nav a:hover { color: var(--gold); background: rgba(122, 28, 46, 0.3); }
        section { max-width: 650px; margin: 3rem auto; padding: 1rem; }
        .cart-box { background: var(--card); border: 1px solid rgba(212, 175, 55, 0.2); padding: 2rem; margin-top: 1.5rem; text-align: left; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(212, 175, 55, 0.1); font-family: sans-serif; }
        .item-title { font-family: 'Georgia', serif; font-size: 1.1rem; }
        .item-details { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
        .qty-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold); width: 26px; height: 26px; cursor: pointer; }
        .remove-btn { background: transparent; color: var(--maroon); border: none; cursor: pointer; margin-left: 10px; font-size: 0.8rem; }
        .summary { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--gold); display: flex; justify-content: space-between; font-size: 1.2rem; }
        .checkout-btn { display: block; width: 100%; background: var(--gold); color: var(--bg); border: none; padding: 14px; font-family: sans-serif; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-top: 1.5rem; cursor: pointer; transition: 0.3s; }
        .checkout-btn:hover { background: #E5C158; }
        .empty-msg { color: var(--muted); text-align: center; padding: 2rem 0; font-style: italic; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Intro</a>
        <a href="product.html">Menu</a>
        <a href="cart.html" class="active">Cart</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section>
        <h2 style="font-size: 2.2rem; letter-spacing: 2px; font-weight: normal;">YOUR ORDER</h2>
        <div class="cart-box">
            <div id="cart-list"></div>
            <div class="summary">
                <span>Total:</span>
                <span id="total-price" style="color: var(--gold);">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout Order</button>
        </div>
    </section>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function renderCart() {
            const listContainer = document.getElementById('cart-list');
            listContainer.innerHTML = '';
            if (cart.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">Your order cart is empty.</div>';
                document.getElementById('total-price').innerText = '$0.00';
                return;
            }
            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                listContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div class="item-title">${item.name}</div>
                            <div class="item-details">$${item.price.toFixed(2)} × ${item.qty}</div>
                        </div>
                        <div>
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                            <span style="margin: 0 8px;">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
        }
        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }
        function checkout() {
            if (cart.length === 0) { alert('Your cart is empty!'); return; }
            alert('Thank you for your order! We are preparing your meal.');
            cart = [];
            localStorage.removeItem('cart');
            renderCart();
        }
        renderCart();
    </script>
</body>
</html>
